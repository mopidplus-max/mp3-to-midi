name: 1. Обучить свою модель (mp3 → midi)

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Сколько минут учить (GitHub жёстко убивает джоб на ~360)"
        default: "270"
      gen_minutes:
        description: "Сколько минут генерировать синтетику (mp3+midi)"
        default: "45"
      count:
        description: "Сколько треков сгенерировать за этот запуск"
        default: "20000"
      seed:
        description: "Сид генератора (по умолчанию — номер запуска, т.е. каждый раз новая музыка)"
        default: ""
      max_seconds:
        description: "Максимальная длина одного сгенерированного трека, сек"
        default: "14"
      batch_size:
        description: "Размер батча"
        default: "8"
      learning_rate:
        description: "Learning rate"
        default: "0.001"
      steps_per_epoch:
        description: "Шагов за эпоху"
        default: "200"
      init_from_url:
        description: "URL checkpoint.tar.gz прошлого запуска (продолжить обучение)"
        default: ""

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    env:
      MINUTES: ${{ inputs.minutes }}
      GEN_MINUTES: ${{ inputs.gen_minutes }}
      COUNT: ${{ inputs.count }}
      SEED: ${{ inputs.seed }}
      MAX_SECONDS: ${{ inputs.max_seconds }}
      BATCH_SIZE: ${{ inputs.batch_size }}
      LEARNING_RATE: ${{ inputs.learning_rate }}
      STEPS_PER_EPOCH: ${{ inputs.steps_per_epoch }}
      INIT_FROM_URL: ${{ inputs.init_from_url }}
      TF_CPP_MIN_LOG_LEVEL: "2"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Системные пакеты (fluidsynth для рендера MIDI → аудио, ffmpeg для mp3)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fluidsynth fluid-soundfont-gm ffmpeg
          fluidsynth --version | head -1
          ffmpeg -version | head -1

      - name: Python-зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install basic-pitch==0.4.0 --no-deps

      - name: Чекпойнт для продолжения обучения
        if: inputs.init_from_url != ''
        run: |
          mkdir -p resume && cd resume
          curl -sSL "$INIT_FROM_URL" -o ckpt.tar.gz
          tar xzf ckpt.tar.gz
          echo "RESUME_WEIGHTS=$(find "$PWD" -name 'weights.index' -printf '%h\n' | head -1)" >> "$GITHUB_ENV"

      - name: Генерирую датасет (mp3+midi, случайные инструменты и стили)
        run: |
          if [ -z "$SEED" ]; then SEED="$GITHUB_RUN_NUMBER"; fi
          python scripts/generate_data.py \
            --out data \
            --count "$COUNT" \
            --minutes "$GEN_MINUTES" \
            --max-seconds "$MAX_SECONDS" \
            --seed "$SEED"
          du -sh data
          cat data/gen_stats.json

      - name: Обучение
        run: |
          EXTRA=""
          if [ -n "$RESUME_WEIGHTS" ]; then EXTRA="--init-from $RESUME_WEIGHTS"; fi
          python scripts/train.py \
            --data data \
            --out out \
            --minutes "$MINUTES" \
            --batch-size "$BATCH_SIZE" \
            --learning-rate "$LEARNING_RATE" \
            --steps-per-epoch "$STEPS_PER_EPOCH" \
            --threads 4 \
            $EXTRA

      - name: Демо (wav → midi своей моделью)
        if: always()
        run: python scripts/make_demo.py --data data --model out/saved_model --out demo || true

      - name: Итог в лог
        if: always()
        run: |
          cp data/gen_stats.json out/ 2>/dev/null || true
          python scripts/report.py out/metrics.json

      - name: Артефакты (модель, чекпойнт, логи, демо)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-run-${{ github.run_number }}
          path: |
            out/**
            demo/**
          if-no-files-found: warn

      - name: Упаковываю чекпойнт
        id: pack
        if: always()
        run: |
          if [ -f out/checkpoints/weights.index ]; then
            tar czf checkpoint.tar.gz -C out checkpoints
            ls -lh checkpoint.tar.gz
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "ok=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Публикую чекпойнт (чтобы продолжить в следующем запуске)
        if: always() && steps.pack.outputs.ok == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ckpt-${{ github.run_number }}
          name: "Чекпойнт после запуска ${{ github.run_number }}"
          prerelease: true
          files: checkpoint.tar.gz
          body: |
            Продолжить обучение этим чекпойнтом:
            в поле `init_from_url` следующего запуска вставь ссылку на `checkpoint.tar.gz`
            из этого релиза.
